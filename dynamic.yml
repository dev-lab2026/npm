http:
  routers:

    portainer:
      rule: "Host(`portainer.cleverapps.io`)"
      service: portainer

    odoo:
      rule: "Host(`odoo.cleverapps.io`)"
      service: odoo
    ssh:
      rule: "Host(`ssh.cleverapps.io`)"
      service: ssh
    prometric:
      rule: "Host(`prometric.cleverapps.io`)"
      service: ssh
  services:

    portainer:
      loadBalancer:
        servers:
          - url: "https://85.215.215.242:9443"

    odoo:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8069"
    prometric:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:3000"

    ssh:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8071"
