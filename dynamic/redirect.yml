http:
  routers:

    portainer:
      rule: "Host(`portainer.tfsn.dev`)"
      service: portainer

    odoo:
      rule: "Host(`odoo.tfsn.dev`)"
      service: odoo

  services:

    portainer:
      loadBalancer:
        servers:
          - url: "https://85.215.215.242:9443"

    odoo:
      loadBalancer:
        servers:
          - url: "odoo.tfsn.dev"
