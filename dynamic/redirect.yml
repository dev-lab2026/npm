http:
  routers:

    portainer:
      rule: "Host(`portainer.tfsn.dev`)"
      service: portainer

    odoo:
      rule: "Host(`odoo.tfsn.dev`)"
      service: odoo
    ssh:
      rule: "Host(`vscode.tfsn.dev`)"
      service: ssh
  services:

    portainer:
      loadBalancer:
        servers:
          - url: "https://85.215.215.242:9443"

    odoo:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8069"
    ssh:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8071"
