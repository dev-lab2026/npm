http:
  routers:

    portainer:
      rule: "Host(`portainer.tfsn.dev`)"
      entryPoints:
        - websecure
      service: portainer
      tls:
        certResolver: le

    odoo:
      rule: "Host(`odoo.tfsn.dev`)"
      entryPoints:
        - websecure
      service: odoo
      tls:
        certResolver: le

    vscode:
      rule: "Host(`npm.cleverapps.io`)"
      entryPoints:
        - websecure
      service: vscode
      tls:
        certResolver: le

    prometric:
      rule: "Host(`prometric.tfsn.dev`)"
      entryPoints:
        - websecure
      service: prometric
      tls:
        certResolver: le

    jenkins:
      rule: "Host(`jenkins.tfsn.dev`)"
      entryPoints:
        - websecure
      service: jenkins
      tls:
        certResolver: le

  services:

    portainer:
      loadBalancer:
        serversTransport: portainerTransport
        servers:
          - url: "https://85.215.215.242:9443"

    odoo:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8069"

    vscode:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:81"

    prometric:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:3000"

    jenkins:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8081"

  serversTransports:

    portainerTransport:
      insecureSkipVerify: true
