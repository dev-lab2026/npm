http:
  routers:

    portainer:
      rule: "Host(`portainer.tfsn.dev`)"
      service: portainer

    odoo:
      rule: "Host(`odoo.tfsn.dev`)"
      service: odoo

    ssh:
      rule: "Host(`ssh.cleverapps.io`)"
      entryPoints:
        - websecure
      service: vscode
      tls:
        certResolver: le

  services:

    portainer:
      loadBalancer:
        servers:
          - url: "https://85.215.215.242:9443"

    odoo:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8069"

    vscode:
      loadBalancer:
        servers:
          - url: "http://85.215.215.242:8080"
